[project]
name = "travel-assistant"
version = "0.1.0"
description = "AI travel assistant with flight and hotel booking agents (LangGraph + MCP + RAG)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-experimental>=0.4.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp<2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors & pyflakes, I = import sorting, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]
